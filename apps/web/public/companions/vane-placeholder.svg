<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" width="300" height="440" role="img" aria-label="Placeholder del retrato de Vane — silueta sintética cyber-noir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#161628"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#785cff"/>
      <stop offset="100%" stop-color="#ff4d9d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#785cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#785cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <!-- background -->
  <rect width="300" height="440" fill="url(#bg)"/>
  <!-- ambient glow -->
  <ellipse cx="150" cy="180" rx="140" ry="160" fill="url(#glow)"/>
  <!-- starfield dots -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="40" cy="50" r="1"/>
    <circle cx="250" cy="70" r="1.2"/>
    <circle cx="80" cy="120" r="0.8"/>
    <circle cx="220" cy="140" r="1"/>
    <circle cx="60" cy="300" r="0.8"/>
    <circle cx="240" cy="320" r="1"/>
    <circle cx="50" cy="380" r="0.6"/>
    <circle cx="200" cy="400" r="0.8"/>
  </g>
  <!-- abstract female silhouette (synthetic, not a real person) -->
  <g transform="translate(150, 230)">
    <!-- hair flow -->
    <path d="M -60 -80 Q -75 -40 -70 20 Q -72 60 -60 100 L -50 110 Q -55 70 -50 30 Q -45 -10 -40 -50 Z" fill="#1a1a2e" opacity="0.8"/>
    <path d="M 60 -80 Q 75 -40 70 20 Q 72 60 60 100 L 50 110 Q 55 70 50 30 Q 45 -10 40 -50 Z" fill="#1a1a2e" opacity="0.8"/>
    <!-- shoulders -->
    <path d="M -65 100 Q -75 130 -80 170 L -80 210 L 80 210 L 80 170 Q 75 130 65 100 Z" fill="#12121f" stroke="url(#neon)" stroke-width="1.5" opacity="0.9"/>
    <!-- neck -->
    <path d="M -18 80 L -18 105 L 18 105 L 18 80 Z" fill="#12121f" stroke="url(#neon)" stroke-width="1" opacity="0.7"/>
    <!-- head -->
    <ellipse cx="0" cy="20" rx="48" ry="58" fill="#16162a" stroke="url(#neon)" stroke-width="1.5" opacity="0.9"/>
    <!-- neon rim highlights -->
    <path d="M -48 20 Q -48 -30 -20 -52" fill="none" stroke="#785cff" stroke-width="2" opacity="0.8" filter="url(#blur)"/>
    <path d="M 48 20 Q 48 -30 20 -52" fill="none" stroke="#ff4d9d" stroke-width="2" opacity="0.8" filter="url(#blur)"/>
    <!-- subtle facial geometry (abstract, non-identifying) -->
    <ellipse cx="-16" cy="10" rx="4" ry="3" fill="#785cff" opacity="0.3"/>
    <ellipse cx="16" cy="10" rx="4" ry="3" fill="#ff4d9d" opacity="0.3"/>
    <path d="M -8 45 Q 0 50 8 45" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- label -->
  <text x="150" y="425" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6c6c80" letter-spacing="2">VANE · PLACEHOLDER SINTÉTICO</text>
</svg>
